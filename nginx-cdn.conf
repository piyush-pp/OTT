server {
  listen 80;

  # Proxy CDN-style URLs like:
  #   http://localhost:8080/videos/{videoId}/hls/master.m3u8
  # to MinIO public bucket objects:
  #   http://minio:9000/ott/videos/{videoId}/hls/master.m3u8
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    proxy_pass http://minio:9000/ott/;
  }
}
