services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ott
      POSTGRES_PASSWORD: ott
      POSTGRES_DB: ott
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/ott || true &&
      mc anonymous set download local/ott &&
      echo 'MinIO bucket ott ready (anonymous download enabled)'"

  cdn:
    image: nginx:1.27-alpine
    depends_on:
      - minio
      - createbuckets
    ports:
      - "8080:80"
    volumes:
      - ./nginx-cdn.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
